name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ${{ matrix.os }}
        env:
            # The electron example builds and tests without launching Electron, so
            # it never needs the platform binary - skip that download.
            ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest ]
                node: [ 22, 24 ]
                rust: [ "1.88.0", "1.93.0" ]
                test: [ ., example/node-bun, example/node-webpack, example/typed-imports, example/esbuild, example/rspack, example/rollup, example/vite, example/next, example/next15, example/next-turbopack, example/electron ]
        steps:
            -   uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            -   uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
                with:
                    node-version: ${{ matrix.node }}
            -   name: Install Rust
                uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
                with:
                    toolchain: ${{ matrix.rust }}
                    targets: wasm32-unknown-unknown
            -   name: Verify Rust installation
                run: rustc --version

            # Lifecycle scripts stay off. Two dependencies deliver their binary
            # through such a script, so the lines below run those installers by
            # hand. wasm-pack sits at the repository root, and every example
            # reads it through the linked loader. Only example/node-bun has bun.
            -   name: Install dependencies
                shell: bash
                env:
                    TEST_DIR: ${{ matrix.test }}
                run: |
                    npm ci --ignore-scripts
                    node node_modules/wasm-pack/install.js
                    if [ "$TEST_DIR" != "." ]; then
                        cd "$TEST_DIR"
                        if [ -f package-lock.json ]; then
                            npm ci --ignore-scripts
                        else
                            npm install --ignore-scripts
                        fi
                        if [ -f node_modules/bun/install.js ]; then
                            node node_modules/bun/install.js
                        fi
                    fi
            -   name: Verify wasm-pack installation
                run: npm exec --no -- wasm-pack --version
                working-directory: ${{ matrix.test }}
            -   name: Run tests
                run: npm test
                working-directory: ${{ matrix.test }}
