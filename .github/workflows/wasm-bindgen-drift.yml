name: wasm-bindgen drift

# Every example commits a Cargo.lock, so no pull request build ever meets a new
# wasm-bindgen. This job drops that pin in the runner workspace only, then builds
# and tests one example against the newest wasm-bindgen release. A red run here
# means upstream changed the generated glue, not that a contributor broke a branch.

on:
    schedule:
        -   cron: "41 13 * * 2"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    vite-newest-wasm-bindgen:
        name: example/vite against the newest wasm-bindgen
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            -   uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
                with:
                    node-version: 24
            -   name: Install Rust
                uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
                with:
                    toolchain: stable
                    targets: wasm32-unknown-unknown
            -   name: Verify Rust installation
                run: rustc --version

            # Lifecycle scripts stay off. wasm-pack is the only dependency that
            # needs one, and example/vite reads it through the linked loader.
            -   name: Install dependencies
                shell: bash
                run: |
                    npm ci --ignore-scripts
                    node node_modules/wasm-pack/install.js
                    cd example/vite && npm install --ignore-scripts

            -   name: Refresh wasm-bindgen to the newest release
                working-directory: example/vite
                run: |
                    cargo add wasm-bindgen
                    echo "Resolved wasm-bindgen:"
                    grep -A1 '^name = "wasm-bindgen"$' Cargo.lock

            -   name: Build and test example/vite
                run: npm test
                working-directory: example/vite

            -   name: Discard the refreshed manifest and lock
                if: always()
                run: |
                    git checkout -- example/vite/Cargo.toml example/vite/Cargo.lock
                    git diff --exit-code -- example/vite/Cargo.toml example/vite/Cargo.lock
