name: wasm-bindgen matrix

# Each job pins wasm-bindgen to one exact version in the runner workspace, then builds and tests.
# The versions 0.2.95, 0.2.105, and 0.2.128 cover the three glue shapes that the loader patches.

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: ${{ matrix.test }} with wasm-bindgen ${{ matrix.version }}
        runs-on: ubuntu-latest
        env:
            # The electron example builds and tests without launching Electron, so
            # it never needs the platform binary - skip that download.
            ELECTRON_SKIP_BINARY_DOWNLOAD: 1
            # The root suite builds Rust through example/typed-imports.
            CRATE: ${{ matrix.test == '.' && 'example/typed-imports' || matrix.test }}
        strategy:
            fail-fast: false
            matrix:
                version: [ "0.2.95", "0.2.105", "0.2.128" ]
                test: [ ., example/node-bun, example/node-webpack, example/web-webpack, example/typed-imports, example/esbuild, example/rspack, example/rollup, example/vite, example/next, example/next15, example/next-turbopack, example/electron ]
        steps:
            -   uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            -   uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
                with:
                    node-version: 24
            -   name: Install Rust
                uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
                with:
                    toolchain: "1.93.0"
                    targets: wasm32-unknown-unknown
            -   name: Verify Rust installation
                run: rustc --version

            # Lifecycle scripts stay off, so the lines below run the wasm-pack and bun
            # installers by hand. Every example reads wasm-pack from the repository root.
            -   name: Install dependencies
                shell: bash
                env:
                    TEST_DIR: ${{ matrix.test }}
                run: |
                    npm ci --ignore-scripts
                    node node_modules/wasm-pack/install.js
                    if [ "$TEST_DIR" != "." ]; then
                        cd "$TEST_DIR"
                        npm ci --ignore-scripts
                        if [ -f node_modules/bun/install.js ]; then
                            node node_modules/bun/install.js
                        fi
                    fi
            -   name: Verify wasm-pack installation
                run: npm exec --no -- wasm-pack --version
                working-directory: ${{ matrix.test }}

            # The lock update fails for the Next examples, which keep the crate entry outside
            # src/lib.rs, so the exact pin drives them.
            -   name: Pin wasm-bindgen to ${{ matrix.version }}
                shell: bash
                env:
                    VERSION: ${{ matrix.version }}
                run: |
                    sed -i -E "s/^wasm-bindgen = .*/wasm-bindgen = \"=$VERSION\"/" "$CRATE/Cargo.toml"
                    grep -qx "wasm-bindgen = \"=$VERSION\"" "$CRATE/Cargo.toml"
                    echo "Pinned requirement:"
                    grep '^wasm-bindgen = ' "$CRATE/Cargo.toml"
                    cargo update --manifest-path "$CRATE/Cargo.toml" --package wasm-bindgen --precise "$VERSION" \
                        || echo "The lock keeps its committed versions. Cargo cannot read this manifest here, and the loader resolves the exact requirement in its build folder."

            -   name: Build and test ${{ matrix.test }}
                run: npm test
                working-directory: ${{ matrix.test }}

            -   name: Discard the pinned manifest and lock
                if: always()
                shell: bash
                run: |
                    git checkout -- "$CRATE/Cargo.toml" "$CRATE/Cargo.lock"
                    git diff --exit-code -- "$CRATE/Cargo.toml" "$CRATE/Cargo.lock"
